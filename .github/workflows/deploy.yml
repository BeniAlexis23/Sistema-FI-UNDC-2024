name: Deploy FI UNDC

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: fi-undc-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: server_oti
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.FI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FI_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          FI_HOST: ${{ secrets.FI_HOST }}
        run: |
          ssh -T \
            -p 2225 \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy_fi@"$FI_HOST"